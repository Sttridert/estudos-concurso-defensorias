<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="editor-token" content="__TOKEN__">
<title>Revisão do conjunto de referência</title>
<style>
  :root { --fundo:#f4f6f9; --painel:#ffffff; --texto:#1c2430; --suave:#5d6978; --linha:#d5dbe4; --acento:#2563eb; --aviso:#b45309; --aviso-fundo:#fef3c7;
          --erro:#b91c1c; --ok:#15803d; --ok-fundo:#dcfce7; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#14181f; --painel:#1c222c; --texto:#e7eaf0; --suave:#9aa6b6; --linha:#333c4a; --acento:#6c9bff;
          --aviso:#fbbf24; --aviso-fundo:#3a2f12; --erro:#f87171; --ok:#4ade80; --ok-fundo:#163a24; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.55 system-ui, "Segoe UI", sans-serif; }
  button, select, textarea { font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:20; background:var(--painel); border-bottom:1px solid var(--linha); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  header h1 { font-size:17px; margin:0 8px 0 0; }
  .btn { border:1px solid var(--linha); background:var(--painel); border-radius:8px; padding:6px 12px; cursor:pointer; color:inherit; text-decoration:none; display:inline-block; }
  .btn:hover:not([disabled]) { border-color:var(--acento); }
  .btn[disabled] { opacity:.45; cursor:default; }
  .btn.primario { background:var(--acento); border-color:var(--acento); color:#fff; }
  .barra { flex:1; min-width:160px; max-width:360px; height:10px; background:var(--linha); border-radius:999px; overflow:hidden; }
  .barra > span { display:block; height:100%; background:var(--acento); }
  .prog { color:var(--suave); font-size:14px; }
  main { max-width:1240px; margin:0 auto; padding:16px; }
  .cartao { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(300px, 1fr); gap:22px; align-items:start; }
  .col-r { position:sticky; top:76px; max-height:calc(100vh - 90px); overflow:auto; }
  @media (max-width: 980px) { .cartao { grid-template-columns:1fr; } .col-r { position:static; max-height:none; } }
  .cartao { background:var(--painel); border:1px solid var(--linha); border-radius:14px; padding:18px 20px; }
  .topo-cartao { display:flex; flex-wrap:wrap; gap:8px; align-items:center; color:var(--suave); font-size:14px; margin-bottom:10px; }
  .etq { border:1px solid var(--linha); border-radius:999px; padding:1px 10px; font-size:12px; }
  .etq.arb { background:var(--aviso-fundo); border-color:var(--aviso); color:var(--aviso); }
  .etq.ctl { background:var(--ok-fundo); border-color:var(--ok); color:var(--ok); }
  .enunciado { font-size:17px; margin:6px 0 10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .alt { margin:3px 0; overflow-wrap:anywhere; }
  .alt b { display:inline-block; width:1.6em; color:var(--suave); }
  .gab { color:var(--suave); font-size:13px; margin-top:8px; }
  h2 { font-size:15px; margin:0 0 8px; color:var(--suave); font-weight:600; }
  .opcao { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:var(--fundo); border:2px solid var(--linha); border-radius:12px; padding:10px 12px;
           margin:8px 0; cursor:pointer; }
  .opcao:hover, .opcao:focus-visible { border-color:var(--acento); outline:none; }
  .opcao.escolhida { border-color:var(--ok); background:var(--ok-fundo); }
  .tecla { flex:none; width:30px; height:30px; border-radius:8px; background:var(--acento); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .opcao .cod { font:13px ui-monospace, Consolas, monospace; color:var(--suave); }
  .opcao .nome { display:block; font-weight:600; overflow-wrap:anywhere; }
  .opcao .fontes { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .fonte { font-size:12px; border-radius:999px; padding:0 8px; background:rgba(127,127,127,.2); color:var(--suave); }
  .linha-extra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  select { padding:7px 9px; border:1px solid var(--linha); border-radius:8px; background:var(--fundo); max-width:100%; }
  textarea { width:100%; padding:8px 10px; border:1px solid var(--linha); border-radius:8px; background:var(--fundo); min-height:64px; }
  .resp { margin-top:14px; padding:10px 12px; border-radius:10px; background:var(--ok-fundo); color:var(--ok); }
  .nav { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .ajuda { color:var(--suave); font-size:13px; margin-top:12px; }
  .vazio { text-align:center; padding:40px 12px; color:var(--suave); }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:90; background:var(--texto); color:var(--fundo); padding:9px 16px; border-radius:10px; max-width:90vw; display:none; }
  #toast.erro { background:var(--erro); color:#fff; }
  dialog { border:1px solid var(--linha); border-radius:12px; background:var(--painel); color:var(--texto); padding:0; width:min(760px, 96vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:16px 18px; }
  .dlg h2 { margin:0 0 8px; color:var(--texto); font-size:17px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { border:1px solid var(--linha); padding:5px 9px; text-align:left; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .nota-aviso { background:var(--aviso-fundo); color:var(--aviso); padding:8px 10px; border-radius:8px; margin:8px 0; }
</style>
</head>
<body>
<header>
  <h1>Revisão do conjunto de referência</h1>
  <label>Mostrar <select id="filtro" aria-label="Filtro da fila"><option value="pendentes">só pendentes</option><option value="arb">arbitragem (não unânimes)</option><option value="ctl">controle (amostra de unânimes)</option><option value="todas">todas</option></select></label>
  <div class="barra" aria-hidden="true"><span id="barra" style="width:0%"></span></div>
  <span class="prog" id="prog" role="status" aria-live="polite"></span>
  <button class="btn" id="btn-resumo" type="button">Resumo</button>
  <a class="btn" href="/">Editor do catálogo</a>
</header>
<main id="principal"></main>
<dialog id="dlg"><div class="dlg" id="dlg-corpo"></div></dialog>
<div id="toast" role="alert"></div>

<script>
"use strict";
(function () {
  var TOKEN = document.querySelector('meta[name="editor-token"]').content;
  var estado = { itens: [], i: 0, filtro: "pendentes", progresso: null };

  function $(s, r) { return (r || document).querySelector(s); }
  function el(tag, attrs, filhos) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "texto") e.textContent = attrs[k];
      else if (k === "classe") e.className = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }
  async function api(metodo, caminho, corpo) {
    var r = await fetch(caminho, { method: metodo, headers: { "X-Editor-Token": TOKEN, "Content-Type": "application/json" }, body: corpo === undefined ? undefined : JSON.stringify(corpo) });
    var j = await r.json();
    if (!r.ok) throw new Error(j.erro || ("erro " + r.status));
    return j;
  }
  var tt = null;
  function toast(msg, erro) { var t = $("#toast"); t.textContent = msg; t.className = erro ? "erro" : ""; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(function () { t.style.display = "none"; }, erro ? 6000 : 2200); }
  var NOMES_FONTE = { atual: "rótulo atual", ia1: "IA, leitura 1", ia2: "IA, leitura 2", cod: "classificador por código" };

  // ---------------------------------------------------------------- dados
  async function carregar(manterChave) {
    try {
      var r = await api("GET", "/api/referencia/fila");
      estado.itens = r.itens; estado.progresso = r.progresso;
    } catch (e) { $("#principal").textContent = ""; $("#principal").appendChild(el("div", { classe: "vazio", texto: e.message })); return; }
    var lista = visiveis();
    var idx = manterChave ? lista.findIndex(function (x) { return x.chave === manterChave; }) : 0;
    estado.i = idx >= 0 ? idx : 0;
    desenhar();
  }
  function visiveis() {
    return estado.itens.filter(function (it) {
      if (estado.filtro === "pendentes") return !it.resposta;
      if (estado.filtro === "arb") return it.tipo !== "controle";
      if (estado.filtro === "ctl") return it.tipo === "controle";
      return true;
    });
  }
  function atual() { var l = visiveis(); return l[estado.i] || null; }

  // ---------------------------------------------------------------- tela
  function desenhar() {
    var p = estado.progresso, m = $("#principal");
    m.textContent = "";
    if (p) { $("#barra").style.width = (p.total ? 100 * p.respondidas / p.total : 0) + "%"; $("#prog").textContent = p.respondidas + " de " + p.total + " respondidas"; }
    var lista = visiveis(), it = atual();
    if (!it) {
      m.appendChild(el("div", { classe: "vazio" }, [el("p", { texto: lista.length ? "" : (estado.filtro === "pendentes" ? "Nada pendente neste filtro. Veja o resumo ou mude o filtro." : "Nenhuma questão neste filtro.") }),
        el("button", { classe: "btn primario", type: "button", texto: "Ver o resumo", onclick: resumo })]));
      return;
    }
    var c = el("section", { classe: "cartao" });
    var esq = el("div", { classe: "col-q" }), dir = el("div", { classe: "col-r" });
    var topo = el("div", { classe: "topo-cartao" });
    topo.appendChild(el("span", { texto: (estado.i + 1) + " de " + lista.length + " neste filtro" }));
    topo.appendChild(el("span", { classe: "etq " + (it.tipo === "controle" ? "ctl" : "arb"), texto: it.tipo === "controle" ? "controle (os três leitores concordam)" :
      (it.tipo === "sem_maioria" ? "arbitragem: os três leitores divergem" : (it.subtipo === "atual_diverge" ? "arbitragem: as duas leituras da IA contra o rótulo atual" : "arbitragem: uma leitura da IA diverge")) }));
    topo.appendChild(el("span", { texto: it.disciplina + " · " + it.prova + " · Q" + it.numero }));
    esq.appendChild(topo);
    esq.appendChild(el("div", { classe: "enunciado", texto: it.enunciado }));
    it.alternativas.forEach(function (a, k) { esq.appendChild(el("div", { classe: "alt" }, [el("b", { texto: "ABCDE"[k] + ")" }), a || ""])); });
    esq.appendChild(el("div", { classe: "gab", texto: "Gabarito: " + (it.gabarito || "—") }));
    dir.appendChild(el("h2", { texto: it.opcoes.length > 1 ? "Em qual ponto esta questão se encaixa? (tecla da opção)" : "Esta classificação está certa? (A confirma)" }));
    it.opcoes.forEach(function (o) {
      var escolhida = it.resposta && it.resposta.ponto_ouro === o.codigo;
      var fontes = el("div", { classe: "fontes" }, o.fontes.map(function (f) { return el("span", { classe: "fonte", texto: NOMES_FONTE[f] }); }));
      var b = el("button", { classe: "opcao" + (escolhida ? " escolhida" : ""), type: "button", "data-letra": o.letra, onclick: function () { responder(it, o.codigo); } }, [
        el("span", { classe: "tecla", texto: o.letra }),
        el("span", {}, [el("span", { classe: "cod", texto: o.codigo + "  ·  " + (o.assunto_codigo || "") + " " + (o.assunto_nome || "") }), el("span", { classe: "nome", texto: o.nome }), fontes])]);
      dir.appendChild(b);
    });
    var linha = el("div", { classe: "linha-extra" });
    var sel = el("select", { id: "sel-outro", "aria-label": "Outro ponto do catálogo" }, [el("option", { value: "", texto: "Outro ponto do catálogo… (tecla O)" })]);
    var atualAss = null, grupo = null;
    it.catalogo.forEach(function (p) {
      if (p.assunto_codigo !== atualAss) { atualAss = p.assunto_codigo; grupo = el("optgroup", { label: p.assunto_codigo + "  " + p.assunto_nome }); sel.appendChild(grupo); }
      grupo.appendChild(el("option", { value: p.codigo, texto: p.codigo + "  " + p.nome }));
    });
    sel.addEventListener("change", function () { if (sel.value) responder(it, sel.value); });
    linha.appendChild(sel);
    linha.appendChild(el("button", { classe: "btn", type: "button", texto: "Nenhum ponto serve (N)", onclick: function () { pedirNota(it); } }));
    dir.appendChild(linha);
    if (it.resposta) {
      dir.appendChild(el("div", { classe: "resp" }, [el("strong", { texto: "Sua resposta: " + it.resposta.ponto_ouro }), it.resposta.nota ? "  — " + it.resposta.nota : "", "  (" + it.resposta.data + ")  ",
        el("button", { classe: "btn", type: "button", texto: "Desfazer (Z)", onclick: function () { desfazer(it); } })]));
    }
    var nav = el("div", { classe: "nav" });
    nav.appendChild(el("button", { classe: "btn", type: "button", texto: "← Anterior", disabled: estado.i === 0 ? "disabled" : null, onclick: function () { ir(-1); } }));
    nav.appendChild(el("button", { classe: "btn", type: "button", texto: "Pular (→ ou S)", onclick: function () { ir(1); } }));
    dir.appendChild(nav);
    dir.appendChild(el("div", { classe: "ajuda", texto: "Teclas: letra da opção responde · O abre a lista de outros pontos · N: nenhum serve · S ou → pula · ← volta · Z desfaz esta resposta. Cada resposta é gravada na hora." }));
    c.appendChild(esq); c.appendChild(dir);
    m.appendChild(c);
  }

  function ir(d) {
    var n = visiveis().length;
    estado.i = Math.max(0, Math.min(n - 1, estado.i + d));
    desenhar(); window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- ações
  async function responder(it, codigo, nota) {
    try {
      var r = await api("POST", "/api/referencia/resposta", { chave: it.chave, ponto_ouro: codigo, nota: nota || "" });
      it.resposta = { ponto_ouro: r.resposta.ponto_ouro, nota: r.resposta.nota, data: r.resposta.data };
      estado.progresso = r.progresso;
      toast("Registrado: " + codigo);
      avancarDepois(it);
    } catch (e) { toast(e.message, true); }
  }
  function avancarDepois(it) {
    var lista = visiveis();
    if (estado.filtro === "pendentes") {                  // a questão respondida sai da lista: o índice já aponta para a próxima
      if (estado.i >= lista.length) estado.i = Math.max(0, lista.length - 1);
    } else if (estado.i < lista.length - 1) estado.i += 1;
    desenhar(); window.scrollTo(0, 0);
  }
  async function desfazer(it) {
    try {
      var r = await api("POST", "/api/referencia/desfazer", { chave: it.chave });
      it.resposta = null; estado.progresso = r.progresso;
      toast("Resposta desfeita.");
      var lista = visiveis(), k = lista.findIndex(function (x) { return x.chave === it.chave; });
      estado.i = k >= 0 ? k : Math.min(estado.i, Math.max(0, lista.length - 1));
      desenhar();
    } catch (e) { toast(e.message, true); }
  }
  function pedirNota(it) {
    var dlg = $("#dlg"), corpo = $("#dlg-corpo");
    corpo.textContent = "";
    var ta = el("textarea", { "aria-label": "Nota", maxlength: "500", placeholder: "Diga em uma frase o que falta no catálogo (ex.: não há ponto para erro de execução)." });
    corpo.appendChild(el("h2", { texto: "Nenhum ponto serve" }));
    corpo.appendChild(el("p", { texto: "A nota é obrigatória: ela vira insumo para o catálogo v2." }));
    corpo.appendChild(ta);
    var ok = el("button", { classe: "btn primario", type: "button", texto: "Registrar" });
    var cancelar = el("button", { classe: "btn", type: "button", texto: "Cancelar", onclick: function () { dlg.close(); } });
    corpo.appendChild(el("div", { classe: "nav" }, [cancelar, ok]));
    ok.addEventListener("click", function () { if (ta.value.trim().length < 3) { toast("Escreva uma nota curta.", true); return; } dlg.close(); responder(it, "NENHUM", ta.value.trim()); });
    dlg.showModal(); ta.focus();
  }

  function pct(x) { return x === null || x === undefined ? "—" : (100 * x).toFixed(0) + "%"; }
  async function resumo() {
    try {
      var r = await api("GET", "/api/referencia/resumo");
      var dlg = $("#dlg"), c = $("#dlg-corpo");
      c.textContent = "";
      c.appendChild(el("h2", { texto: "Resumo da revisão" }));
      var tb = el("tbody", {});
      var nu = r.nao_unanimes, ct = r.controle;
      [["Arbitragem (não unânimes)", nu.respondidas + " de " + nu.total],
       ["   você concordou com o rótulo atual", nu.com_atual], ["   você concordou com a dupla de leituras da IA", nu.com_dupla_ia],
       ["   outro ponto", nu.outro], ["   nenhum ponto serve", nu.nenhum],
       ["Controle (unânimes sorteadas)", ct.respondidas + " de " + ct.total],
       ["   você discordou da unanimidade", ct.discordou + (ct.respondidas ? "  (" + pct(ct.taxa_discordancia) + "; IC 95%: " + pct(ct.ic95[0]) + " a " + pct(ct.ic95[1]) + ")" : "")]
      ].forEach(function (l) { tb.appendChild(el("tr", {}, [el("td", { texto: l[0] }), el("td", { classe: "num", texto: String(l[1]) })])); });
      ["atual", "ia1", "ia2"].forEach(function (f) { var a = r.acordo_humano[f]; tb.appendChild(el("tr", {}, [el("td", { texto: "Concordância com " + NOMES_FONTE[f] }), el("td", { classe: "num", texto: a.n ? pct(a.acordo) + " de " + a.n : "—" })])); });
      c.appendChild(el("table", {}, [tb]));
      var e = r.estimativa;
      if (e) {
        c.appendChild(el("h2", { texto: "Estimativa do acerto do rótulo atual nas " + e.questoes_da_amostra + " questões da amostra" }));
        c.appendChild(el("p", { texto: pct(e.acerto_rotulo_atual) + "  (IC 95%: " + pct(e.ic95[0]) + " a " + pct(e.ic95[1]) + ")" }));
        if (e.aviso) c.appendChild(el("div", { classe: "nota-aviso", texto: e.aviso }));
      } else c.appendChild(el("div", { classe: "nota-aviso", texto: "Ainda não há estimativa: responda ao menos uma questão de controle." }));
      c.appendChild(el("p", { classe: "ajuda", texto: "Estimativa estratificada: as não unânimes contam pelo que você respondeu (todas); as unânimes, pela taxa de discordância da amostra de controle. Com poucas respostas de controle o intervalo é largo." }));
      c.appendChild(el("div", { classe: "nav" }, [el("button", { classe: "btn primario", type: "button", texto: "Fechar", onclick: function () { dlg.close(); } })]));
      dlg.showModal();
    } catch (er) { toast(er.message, true); }
  }

  // ---------------------------------------------------------------- teclado
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("textarea, input") || $("#dlg").open || e.ctrlKey || e.metaKey || e.altKey) return;
    var it = atual();
    if (!it) return;
    var k = e.key;
    if (e.target.tagName === "SELECT") { if (k === "Escape") e.target.blur(); return; }
    var op = it.opcoes.find(function (o) { return o.letra.toLowerCase() === k.toLowerCase(); });
    if (op) { e.preventDefault(); responder(it, op.codigo); }
    else if (k === "o" || k === "O") { e.preventDefault(); $("#sel-outro").focus(); }
    else if (k === "n" || k === "N") { e.preventDefault(); pedirNota(it); }
    else if (k === "s" || k === "S" || k === "ArrowRight") { e.preventDefault(); ir(1); }
    else if (k === "ArrowLeft") { e.preventDefault(); ir(-1); }
    else if ((k === "z" || k === "Z") && it.resposta) { e.preventDefault(); desfazer(it); }
  });

  $("#filtro").addEventListener("change", function (e) { estado.filtro = e.target.value; estado.i = 0; desenhar(); });
  $("#btn-resumo").addEventListener("click", resumo);
  window.__revisao = { estado: estado };
  carregar();
})();
</script>
</body>
</html>
